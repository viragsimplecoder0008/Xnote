name: Build Xnote

on:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev dpkg-dev

      - name: Build Xnote
        run: make

      - name: Create Debian package
        run: |
          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin

          cp xnote package/usr/bin/xnote

          cat > package/DEBIAN/control << 'EOF'
          Package: xnote
          Version: 1.0.0
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Xnote
          Description: A simple terminal text editor
           Xnote is a lightweight terminal text editor.
          Depends: libncurses6
          EOF

          dpkg-deb --build package xnote_1.0.0_amd64.deb

      - name: Upload Xnote Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: xnote-deb
          path: xnote_1.0.0_amd64.deb

  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev rpm

      - name: Build Xnote
        run: make

      - name: Create RPM package
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          cat > rpmbuild/SPECS/xnote.spec << EOF
          Name:           xnote
          Version:        1.0.0
          Release:        1
          Summary:        A simple terminal text editor
          License:        GPL-3.0
          BuildArch:      x86_64
          Requires:       ncurses-libs

          %description
          Xnote is a lightweight terminal text editor.

          %install
          mkdir -p %{buildroot}/usr/bin
          cp $(pwd)/xnote %{buildroot}/usr/bin/xnote
          chmod 755 %{buildroot}/usr/bin/xnote

          %files
          /usr/bin/xnote
          EOF

          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            -bb rpmbuild/SPECS/xnote.spec

          cp rpmbuild/RPMS/x86_64/*.rpm xnote-1.0.0-1.x86_64.rpm

      - name: Upload Xnote RPM installer
        uses: actions/upload-artifact@v4
        with:
          name: xnote-rpm
          path: xnote-1.0.0-1.x86_64.rpm

  build-arch:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Build Xnote
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev
          make

      - name: Install Arch packaging tools
        run: |
          sudo apt install -y zstd

      - name: Create Arch package
        run: |
          mkdir -p arch-package/usr/bin

          cp xnote arch-package/usr/bin/xnote

          cat > PKGBUILD << 'EOF'
          pkgname=xnote
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A simple terminal text editor"
          arch=('x86_64')
          license=('GPL-3.0')
          depends=('ncurses')

          package() {
              install -Dm755 "$srcdir/arch-package/usr/bin/xnote" \
                  "$pkgdir/usr/bin/xnote"
          }
          EOF

          makepkg \
            --nodeps \
            --force \
            --cleanbuild \
            --packagelist

      - name: Build Arch package
        run: |
          mkdir -p arch-package/usr/bin
          cp xnote arch-package/usr/bin/xnote

          cat > PKGBUILD << 'EOF'
          pkgname=xnote
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A simple terminal text editor"
          arch=('x86_64')
          license=('GPL-3.0')
          depends=('ncurses')

          package() {
              install -Dm755 "$srcdir/arch-package/usr/bin/xnote" \
                  "$pkgdir/usr/bin/xnote"
          }
          EOF

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              pacman -Sy --noconfirm base-devel &&
              makepkg --nodeps --force
            '

      - name: Upload Xnote Arch package
        uses: actions/upload-artifact@v4
        with:
          name: xnote-arch
          path: xnote-*.pkg.tar.zst
