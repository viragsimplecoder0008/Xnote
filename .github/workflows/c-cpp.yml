name: Build Xnote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Xnote version"
        required: true
        default: "1.0.0"

jobs:

  # ============================================================
  # DEBIAN / UBUNTU
  # ============================================================

  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev dpkg-dev

      - name: Build Xnote
        run: make

      - name: Create Debian package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin

          cp xnote package/usr/bin/xnote
          chmod 755 package/usr/bin/xnote

          cat > package/DEBIAN/control << EOF
          Package: xnote
          Version: ${VERSION}
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Xnote
          Description: A simple terminal text editor
           Xnote is a lightweight terminal text editor.
          Depends: libncurses6
          EOF

          dpkg-deb --build package "xnote_${VERSION}_amd64.deb"

      - name: Upload Xnote Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: xnote-deb
          path: xnote_${{ inputs.version }}_amd64.deb


  # ============================================================
  # FEDORA / RED HAT RPM
  # ============================================================

  build-rpm:
    runs-on: ubuntu-latest

    container:
      image: fedora:44

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc \
            make \
            ncurses-devel \
            rpm-build

      - name: Build Xnote
        run: |
          make

      - name: Verify Xnote binary
        run: |
          file xnote
          ldd xnote

      - name: Create RPM build directories
        run: |
          mkdir -p rpmbuild/BUILD
          mkdir -p rpmbuild/BUILDROOT
          mkdir -p rpmbuild/RPMS
          mkdir -p rpmbuild/SOURCES
          mkdir -p rpmbuild/SPECS
          mkdir -p rpmbuild/SRPMS

      - name: Copy Xnote into RPM sources
        run: |
          cp xnote rpmbuild/SOURCES/xnote
          chmod 755 rpmbuild/SOURCES/xnote

      - name: Create RPM spec
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat > rpmbuild/SPECS/xnote.spec << EOF
          Name:           xnote
          Version:        ${VERSION}
          Release:        1
          Summary:        A simple terminal text editor
          License:        GPL-3.0
          BuildArch:      x86_64
          Requires:       ncurses-libs

          %description
          Xnote is a lightweight terminal text editor.

          %prep

          %build

          %install
          mkdir -p %{buildroot}/usr/bin
          install -m 755 %{_sourcedir}/xnote %{buildroot}/usr/bin/xnote

          %files
          /usr/bin/xnote
          EOF

      - name: Build RPM
        run: |
          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            -bb rpmbuild/SPECS/xnote.spec

      - name: Rename RPM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp rpmbuild/RPMS/x86_64/*.rpm \
            "xnote-${VERSION}-1.x86_64.rpm"

      - name: Verify RPM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rpm -qip "xnote-${VERSION}-1.x86_64.rpm"
          rpm -qpR "xnote-${VERSION}-1.x86_64.rpm"

      - name: Upload Xnote RPM installer
        uses: actions/upload-artifact@v4
        with:
          name: xnote-rpm
          path: xnote-${{ inputs.version }}-1.x86_64.rpm


  # ============================================================
  # ARCH LINUX
  # ============================================================

  build-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm base-devel ncurses

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Xnote
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && make"

      - name: Create Arch package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p arch-package/usr/bin

          cp xnote arch-package/usr/bin/xnote
          chmod 755 arch-package/usr/bin/xnote

          cat > PKGBUILD << EOF
          pkgname=xnote
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="A simple terminal text editor"
          arch=('x86_64')
          license=('GPL-3.0')
          depends=('ncurses')

          package() {
              install -Dm755 \
                  "\$startdir/arch-package/usr/bin/xnote" \
                  "\$pkgdir/usr/bin/xnote"
          }
          EOF

          chown builder:builder PKGBUILD
          chown -R builder:builder arch-package

      - name: Build Arch package
        run: |
          su builder -c \
            "cd '$GITHUB_WORKSPACE' && makepkg --nodeps --force"

      - name: Upload Xnote Arch package
        uses: actions/upload-artifact@v4
        with:
          name: xnote-arch
          path: xnote-*.pkg.tar.zst


  # ============================================================
  # APPIMAGE
  # ============================================================

  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            libncurses-dev \
            wget \
            python3 \
            python3-pip

      - name: Build Xnote
        run: |
          make

      - name: Install Pillow
        run: |
          python3 -m pip install \
            --user \
            Pillow \
            --break-system-packages

      - name: Prepare Xnote AppDir
        run: |
          mkdir -p Xnote.AppDir/usr/bin
          mkdir -p Xnote.AppDir/usr/share/applications
          mkdir -p Xnote.AppDir/usr/share/icons/hicolor/256x256/apps

          cp xnote Xnote.AppDir/usr/bin/xnote
          chmod 755 Xnote.AppDir/usr/bin/xnote

      - name: Prepare Xnote Icon
        run: |
          python3 - << 'PY'
          from PIL import Image

          source = "assets/Xnote-logo.png"
          output = "Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png"

          print("Loading:", source)

          image = Image.open(source)

          print("Original size:", image.size)

          image = image.convert("RGBA")

          image = image.resize(
              (256, 256),
              Image.Resampling.LANCZOS
          )

          image.save(output, "PNG")

          print("Created:", output)
          print("Final size:", image.size)
          PY

      - name: Verify Xnote Icon
        run: |
          file Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png

          python3 - << 'PY'
          from PIL import Image

          path = "Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png"

          image = Image.open(path)

          print("Icon size:", image.size)

          assert image.size == (256, 256)

          print("Icon verification: OK")
          PY

      - name: Create desktop file
        run: |
          cat > Xnote.AppDir/usr/share/applications/xnote.desktop << 'EOF'
          [Desktop Entry]
          Name=Xnote
          Comment=A simple terminal text editor
          Exec=xnote
          Icon=xnote
          Type=Application
          Categories=Utility;TextEditor;
          Terminal=true
          EOF

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy

      - name: Build AppImage
        run: |
          ./linuxdeploy \
            --appdir Xnote.AppDir \
            --desktop-file Xnote.AppDir/usr/share/applications/xnote.desktop \
            --icon-file Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png \
            --output appimage

          ls -lh *.AppImage

      - name: Rename AppImage
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mv Xnote*.AppImage \
            "Xnote-${VERSION}-x86_64.AppImage"

      - name: Upload Xnote AppImage
        uses: actions/upload-artifact@v4
        with:
          name: xnote-appimage
          path: Xnote-${{ inputs.version }}-x86_64.AppImage


  # ============================================================
  # CREATE GITHUB RELEASE
  # ============================================================

  release:
    runs-on: ubuntu-latest

    needs:
      - build-deb
      - build-rpm
      - build-arch
      - build-appimage

    permissions:
      contents: write

    steps:
      # --------------------------------------------------------
      # THIS WAS THE MISSING PART
      # --------------------------------------------------------

      - name: Get Xnote repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Download artifacts
      # --------------------------------------------------------

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: xnote-deb
          path: release-assets

      - name: Download RPM package
        uses: actions/download-artifact@v4
        with:
          name: xnote-rpm
          path: release-assets

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: xnote-arch
          path: release-assets

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: xnote-appimage
          path: release-assets

      # --------------------------------------------------------
      # Check release files
      # --------------------------------------------------------

      - name: List release files
        run: |
          echo "Release files:"
          ls -lh release-assets

      # --------------------------------------------------------
      # Create release notes
      # --------------------------------------------------------

      - name: Create release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat > release-notes.md << EOF
          # Xnote ${VERSION}

          Xnote is a lightweight terminal text editor designed for simplicity, usability, and a clean experience.

          ## Downloads

          Choose the package for your Linux distribution:

          - Debian / Ubuntu: \`xnote_${VERSION}_amd64.deb\`
          - Fedora / Red Hat: \`xnote-${VERSION}-1.x86_64.rpm\`
          - Arch Linux: \`xnote-${VERSION}-1-x86_64.pkg.tar.zst\`
          - Linux AppImage: \`Xnote-${VERSION}-x86_64.AppImage\`

          ## Features

          - Terminal-based text editing
          - Save with Ctrl+S
          - Quit with Ctrl+X
          - Command menu with Ctrl+R
          - Basic syntax highlighting
          - Line numbers
          - Debian package
          - RPM package
          - Arch Linux package
          - AppImage support

          ## Requirements

          Xnote is currently built for x86_64 Linux systems.

          Package dependencies are handled by the corresponding package manager where applicable.

          ## Notes

          This is Xnote ${VERSION}.

          Xnote is still under development, so expect more features and improvements in future releases.
          EOF

      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            release-assets/* \
            --title "Xnote ${VERSION}" \
            --notes-file release-notes.md
