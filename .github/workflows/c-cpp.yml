name: Build Xnote

on:
  workflow_dispatch:

jobs:

  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev dpkg-dev

      - name: Build Xnote
        run: make

      - name: Create Debian package
        run: |
          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin

          cp xnote package/usr/bin/xnote

          cat > package/DEBIAN/control << 'EOF'
          Package: xnote
          Version: 1.0.0
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Xnote
          Description: A simple terminal text editor
           Xnote is a lightweight terminal text editor.
          Depends: libncurses6
          EOF

          dpkg-deb --build package xnote_1.0.0_amd64.deb

      - name: Upload Xnote Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: xnote-deb
          path: xnote_1.0.0_amd64.deb


  build-rpm:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev rpm

      - name: Build Xnote
        run: make

      - name: Create RPM package
        run: |
          mkdir -p rpmbuild/BUILD
          mkdir -p rpmbuild/BUILDROOT
          mkdir -p rpmbuild/RPMS
          mkdir -p rpmbuild/SOURCES
          mkdir -p rpmbuild/SPECS
          mkdir -p rpmbuild/SRPMS

          cat > rpmbuild/SPECS/xnote.spec << 'EOF'
          Name:           xnote
          Version:        1.0.0
          Release:        1
          Summary:        A simple terminal text editor
          License:        GPL-3.0
          BuildArch:      x86_64
          Requires:       ncurses-libs

          %description
          Xnote is a lightweight terminal text editor.

          %install
          mkdir -p %{buildroot}/usr/bin
          cp %{_topdir}/../xnote %{buildroot}/usr/bin/xnote
          chmod 755 %{buildroot}/usr/bin/xnote

          %files
          /usr/bin/xnote
          EOF

          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            -bb rpmbuild/SPECS/xnote.spec

          cp rpmbuild/RPMS/x86_64/*.rpm xnote-1.0.0-1.x86_64.rpm

      - name: Upload Xnote RPM installer
        uses: actions/upload-artifact@v4
        with:
          name: xnote-rpm
          path: xnote-1.0.0-1.x86_64.rpm


  build-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm base-devel ncurses

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Xnote
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && make"

      - name: Create Arch package
        run: |
          mkdir -p arch-package/usr/bin
          cp xnote arch-package/usr/bin/xnote

          cat > PKGBUILD << 'EOF'
          pkgname=xnote
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A simple terminal text editor"
          arch=('x86_64')
          license=('GPL-3.0')
          depends=('ncurses')

          package() {
              install -Dm755 "$startdir/arch-package/usr/bin/xnote" \
                  "$pkgdir/usr/bin/xnote"
          }
          EOF

          chown builder:builder PKGBUILD
          chown -R builder:builder arch-package

          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --nodeps --force"

      - name: Upload Xnote Arch package
        uses: actions/upload-artifact@v4
        with:
          name: xnote-arch
          path: xnote-*.pkg.tar.zst


  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev wget imagemagick

      - name: Build Xnote
        run: make

      - name: Prepare Xnote Icon
        run: |
          mkdir -p Xnote.AppDir/usr/bin
          mkdir -p Xnote.AppDir/usr/share/applications
          mkdir -p Xnote.AppDir/usr/share/icons/hicolor/256x256/apps

          magick assets/Xnote-logo.png \
            -resize 256x256 \
            Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png

      - name: Copy Xnote binary
        run: |
          cp xnote Xnote.AppDir/usr/bin/xnote

      - name: Create desktop file
        run: |
          cat > Xnote.AppDir/usr/share/applications/xnote.desktop << 'EOF'
          [Desktop Entry]
          Name=Xnote
          Comment=A simple terminal text editor
          Exec=xnote
          Icon=xnote
          Type=Application
          Categories=Utility;TextEditor;
          Terminal=true
          EOF

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

      - name: Build AppImage
        run: |
          ./linuxdeploy \
            --appdir Xnote.AppDir \
            --desktop-file Xnote.AppDir/usr/share/applications/xnote.desktop \
            --icon-file Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png \
            --output appimage

          mv Xnote*.AppImage Xnote-1.0.0-x86_64.AppImage

      - name: Upload Xnote AppImage
        uses: actions/upload-artifact@v4
        with:
          name: xnote-appimage
          path: Xnote-1.0.0-x86_64.AppImage
