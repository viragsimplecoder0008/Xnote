name: Build Xnote

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:

  # ============================================================
  # DEBIAN / UBUNTU
  # ============================================================

  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev dpkg-dev

      - name: Build Xnote
        run: make

      - name: Create Debian package
        run: |
          mkdir -p package/DEBIAN
          mkdir -p package/usr/bin

          cp xnote package/usr/bin/xnote
          chmod 755 package/usr/bin/xnote

          cat > package/DEBIAN/control << 'EOF'
          Package: xnote
          Version: 1.0.0
          Section: editors
          Priority: optional
          Architecture: amd64
          Maintainer: Xnote
          Description: A simple terminal text editor
           Xnote is a lightweight terminal text editor.
          Depends: libncurses6
          EOF

          dpkg-deb --build package xnote_1.0.0_amd64.deb

      - name: Upload Xnote Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: xnote-deb
          path: xnote_1.0.0_amd64.deb


  # ============================================================
  # FEDORA / RED HAT RPM
  # ============================================================

  build-rpm:
    runs-on: ubuntu-latest

    container:
      image: fedora:44

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            gcc \
            make \
            ncurses-devel \
            rpm-build

      - name: Build Xnote
        run: |
          make

      - name: Verify Xnote binary
        run: |
          file xnote
          ldd xnote

      - name: Create RPM build directories
        run: |
          mkdir -p rpmbuild/BUILD
          mkdir -p rpmbuild/BUILDROOT
          mkdir -p rpmbuild/RPMS
          mkdir -p rpmbuild/SOURCES
          mkdir -p rpmbuild/SPECS
          mkdir -p rpmbuild/SRPMS

      - name: Copy Xnote into RPM sources
        run: |
          cp xnote rpmbuild/SOURCES/xnote
          chmod 755 rpmbuild/SOURCES/xnote

      - name: Create RPM spec
        run: |
          cat > rpmbuild/SPECS/xnote.spec << 'EOF'
          Name:           xnote
          Version:        1.0.0
          Release:        1
          Summary:        A simple terminal text editor
          License:        GPL-3.0
          BuildArch:      x86_64
          Requires:       ncurses-libs

          %description
          Xnote is a lightweight terminal text editor.

          %prep

          %build

          %install
          mkdir -p %{buildroot}/usr/bin
          install -m 755 %{_sourcedir}/xnote %{buildroot}/usr/bin/xnote

          %files
          /usr/bin/xnote
          EOF

      - name: Build RPM
        run: |
          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            -bb rpmbuild/SPECS/xnote.spec

      - name: Rename RPM
        run: |
          cp rpmbuild/RPMS/x86_64/*.rpm \
            xnote-1.0.0-1.x86_64.rpm

      - name: Verify RPM
        run: |
          rpm -qip xnote-1.0.0-1.x86_64.rpm
          rpm -qpR xnote-1.0.0-1.x86_64.rpm

      - name: Upload Xnote RPM installer
        uses: actions/upload-artifact@v4
        with:
          name: xnote-rpm
          path: xnote-1.0.0-1.x86_64.rpm


  # ============================================================
  # ARCH LINUX
  # ============================================================

  build-arch:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm base-devel ncurses

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build Xnote
        run: |
          su builder -c "cd '$GITHUB_WORKSPACE' && make"

      - name: Create Arch package
        run: |
          mkdir -p arch-package/usr/bin

          cp xnote arch-package/usr/bin/xnote
          chmod 755 arch-package/usr/bin/xnote

          cat > PKGBUILD << 'EOF'
          pkgname=xnote
          pkgver=1.0.0
          pkgrel=1
          pkgdesc="A simple terminal text editor"
          arch=('x86_64')
          license=('GPL-3.0')
          depends=('ncurses')

          package() {
              install -Dm755 \
                  "$startdir/arch-package/usr/bin/xnote" \
                  "$pkgdir/usr/bin/xnote"
          }
          EOF

          chown builder:builder PKGBUILD
          chown -R builder:builder arch-package

      - name: Build Arch package
        run: |
          su builder -c \
            "cd '$GITHUB_WORKSPACE' && makepkg --nodeps --force"

      - name: Upload Xnote Arch package
        uses: actions/upload-artifact@v4
        with:
          name: xnote-arch
          path: xnote-*.pkg.tar.zst


  # ============================================================
  # APPIMAGE
  # ============================================================

  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            libncurses-dev \
            wget \
            python3 \
            python3-pip

      - name: Build Xnote
        run: |
          make

      # --------------------------------------------------------
      # Install Pillow
      # --------------------------------------------------------

      - name: Install Pillow
        run: |
          python3 -m pip install \
            --user \
            Pillow \
            --break-system-packages

      # --------------------------------------------------------
      # Create AppDir
      # --------------------------------------------------------

      - name: Prepare Xnote AppDir
        run: |
          mkdir -p Xnote.AppDir/usr/bin
          mkdir -p Xnote.AppDir/usr/share/applications
          mkdir -p Xnote.AppDir/usr/share/icons/hicolor/256x256/apps

          cp xnote Xnote.AppDir/usr/bin/xnote
          chmod 755 Xnote.AppDir/usr/bin/xnote

      # --------------------------------------------------------
      # Resize Canva's 2000x2000 logo
      # NO MAGICK!
      # --------------------------------------------------------

      - name: Prepare Xnote Icon
        run: |
          python3 - << 'PY'
          from PIL import Image

          source = "assets/Xnote-logo.png"
          output = "Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png"

          print("Loading:", source)

          image = Image.open(source)

          print("Original size:", image.size)

          image = image.convert("RGBA")

          image = image.resize(
              (256, 256),
              Image.Resampling.LANCZOS
          )

          image.save(output, "PNG")

          print("Created:", output)
          print("Final size:", image.size)
          PY

      # --------------------------------------------------------
      # Verify icon
      # --------------------------------------------------------

      - name: Verify Xnote Icon
        run: |
          file Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png

          python3 - << 'PY'
          from PIL import Image

          path = "Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png"

          image = Image.open(path)

          print("Icon size:", image.size)

          assert image.size == (256, 256)

          print("Icon verification: OK")
          PY

      # --------------------------------------------------------
      # Desktop entry
      # --------------------------------------------------------

      - name: Create desktop file
        run: |
          cat > Xnote.AppDir/usr/share/applications/xnote.desktop << 'EOF'
          [Desktop Entry]
          Name=Xnote
          Comment=A simple terminal text editor
          Exec=xnote
          Icon=xnote
          Type=Application
          Categories=Utility;TextEditor;
          Terminal=true
          EOF

      # --------------------------------------------------------
      # Download linuxdeploy
      # --------------------------------------------------------

      - name: Download linuxdeploy
        run: |
          wget -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy

      # --------------------------------------------------------
      # Build AppImage
      # --------------------------------------------------------

      - name: Build AppImage
        run: |
          ./linuxdeploy \
            --appdir Xnote.AppDir \
            --desktop-file Xnote.AppDir/usr/share/applications/xnote.desktop \
            --icon-file Xnote.AppDir/usr/share/icons/hicolor/256x256/apps/xnote.png \
            --output appimage

          ls -lh *.AppImage

          mv Xnote*.AppImage \
            Xnote-1.0.0-x86_64.AppImage

      # --------------------------------------------------------
      # Upload AppImage
      # --------------------------------------------------------

      - name: Upload Xnote AppImage
        uses: actions/upload-artifact@v4
        with:
          name: xnote-appimage
          path: Xnote-1.0.0-x86_64.AppImage


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build-deb
      - build-rpm
      - build-arch
      - build-appimage

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # --------------------------------------------------------
      # Download Debian package
      # --------------------------------------------------------

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: xnote-deb
          path: release

      # --------------------------------------------------------
      # Download RPM package
      # --------------------------------------------------------

      - name: Download RPM package
        uses: actions/download-artifact@v4
        with:
          name: xnote-rpm
          path: release

      # --------------------------------------------------------
      # Download Arch package
      # --------------------------------------------------------

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: xnote-arch
          path: release

      # --------------------------------------------------------
      # Download AppImage
      # --------------------------------------------------------

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: xnote-appimage
          path: release

      # --------------------------------------------------------
      # Show release files
      # --------------------------------------------------------

      - name: Verify release files
        run: |
          echo "Release files:"
          ls -lh release/

      # --------------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Xnote ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*
