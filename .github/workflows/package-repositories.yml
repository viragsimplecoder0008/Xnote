name: Publish Xnote Package Repositories

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Xnote
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ============================================================
  # CHECK BUILD
  # ============================================================

  check-build:
    name: Check Xnote build
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Get latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json tagName,name

  # ============================================================
  # PUBLISH PACKAGES
  # ============================================================

  publish:
    name: Publish package repositories
    runs-on: ubuntu-latest

    needs: check-build

    steps:
      - name: Get Xnote
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt update
          sudo apt install -y \
            dpkg-dev \
            rpm \
            createrepo-c

      # ----------------------------------------------------------
      # Download latest release
      # ----------------------------------------------------------

      - name: Download latest release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/deb
          mkdir -p packages/rpm
          mkdir -p packages/appimage

          gh release download \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir packages/deb

          gh release download \
            --repo "${{ github.repository }}" \
            --pattern "*.rpm" \
            --dir packages/rpm

          gh release download \
            --repo "${{ github.repository }}" \
            --pattern "*.AppImage" \
            --dir packages/appimage

      # ==========================================================
      # APT REPOSITORY
      # ==========================================================

      - name: Prepare APT repository
        run: |
          mkdir -p repository/apt/pool/main
          mkdir -p repository/apt/dists/stable/main/binary-amd64

          cp packages/deb/*.deb \
            repository/apt/pool/main/

          cd repository/apt

          dpkg-scanpackages \
            pool/main \
            /dev/null \
            > dists/stable/main/binary-amd64/Packages

          gzip -kf \
            dists/stable/main/binary-amd64/Packages

      # ==========================================================
      # RPM REPOSITORY
      # ==========================================================

      - name: Prepare RPM repository
        run: |
          mkdir -p repository/rpm/x86_64

          cp packages/rpm/*.rpm \
            repository/rpm/x86_64/

          createrepo_c \
            repository/rpm/x86_64

      # ==========================================================
      # APPIMAGE DOWNLOADS
      # ==========================================================

      - name: Copy AppImage
        run: |
          mkdir -p repository/appimage

          cp packages/appimage/*.AppImage \
            repository/appimage/

      # ==========================================================
      # Repository information
      # ==========================================================

      - name: Create repository index
        run: |
          cat > repository/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Xnote Linux Packages</title>
          </head>
          <body>
              <h1>Xnote Linux Packages</h1>

              <h2>Debian / Ubuntu / Linux Mint</h2>
              <p>APT repository:</p>
              <pre>https://viragsimplecoder0008.github.io/Xnote/apt/</pre>

              <h2>Fedora / Red Hat</h2>
              <p>RPM repository:</p>
              <pre>https://viragsimplecoder0008.github.io/Xnote/rpm/</pre>

              <h2>AppImage</h2>
              <p>
                  Download the AppImage from the Xnote GitHub Releases page.
              </p>
          </body>
          </html>
          EOF

      # ==========================================================
      # PUBLISH TO GITHUB PAGES BRANCH
      # ==========================================================

      - name: Publish repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          cp -r repository/. .

          git add .

          git commit \
            -m "Publish Xnote package repositories" \
            || echo "Nothing to commit"

          git push origin gh-pages
