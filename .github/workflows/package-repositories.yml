name: Publish Xnote Package Repositories

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Build Xnote
    types:
      - completed

permissions:
  contents: write

jobs:

  publish:
    name: Publish Xnote repositories
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:

      # ==========================================================
      # GET SOURCE
      # ==========================================================

      - name: Get Xnote
        uses: actions/checkout@v4

      # ==========================================================
      # INSTALL TOOLS
      # ==========================================================

      - name: Install repository tools
        run: |
          sudo apt update

          sudo apt install -y \
            dpkg-dev \
            rpm \
            createrepo-c \
            gnupg

      # ==========================================================
      # GET LATEST RELEASE
      # ==========================================================

      - name: Download latest release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/deb
          mkdir -p packages/rpm
          mkdir -p packages/appimage

          gh release download \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" \
            --dir packages/deb

          gh release download \
            --repo "${{ github.repository }}" \
            --pattern "*.rpm" \
            --dir packages/rpm

          gh release download \
            --repo "${{ github.repository }}" \
            --pattern "*.AppImage" \
            --dir packages/appimage

      # ==========================================================
      # FIND VERSION
      # ==========================================================

      - name: Get release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh release view \
            --repo "${{ github.repository }}" \
            --json tagName \
            --jq '.tagName' \
            | sed 's/^v//')

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Xnote version: $VERSION"

      # ==========================================================
      # PREPARE WEBSITE
      # ==========================================================

      - name: Prepare repository
        run: |
          rm -rf repository

          mkdir -p repository/apt/pool/main
          mkdir -p repository/apt/dists/stable/main/binary-amd64

          mkdir -p repository/rpm/x86_64

          mkdir -p repository/appimage

      # ==========================================================
      # COPY DEBIAN PACKAGE
      # ==========================================================

      - name: Copy Debian package
        run: |
          cp packages/deb/*.deb \
            repository/apt/pool/main/

      # ==========================================================
      # CREATE APT PACKAGES INDEX
      # ==========================================================

      - name: Create APT Packages index
        run: |
          cd repository/apt

          dpkg-scanpackages \
            pool/main \
            /dev/null \
            > dists/stable/main/binary-amd64/Packages

          gzip -kf \
            dists/stable/main/binary-amd64/Packages

      # ==========================================================
      # CREATE APT RELEASE METADATA
      # ==========================================================

      - name: Create APT Release metadata
        run: |
          cd repository/apt

          cat > dists/stable/Release << EOF
          Origin: Xnote
          Label: Xnote
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: Xnote package repository
          Date: $(date -Ru)

          EOF

          cd dists/stable

          echo "MD5Sum:" >> Release

          find main -type f | while read file; do
            hash=$(md5sum "$file" | awk '{print $1}')
            size=$(stat -c%s "$file")

            printf " %s %16s %s\n" \
              "$hash" \
              "$size" \
              "$file" >> Release
          done

          echo "SHA256:" >> Release

          find main -type f | while read file; do
            hash=$(sha256sum "$file" | awk '{print $1}')
            size=$(stat -c%s "$file")

            printf " %s %16s %s\n" \
              "$hash" \
              "$size" \
              "$file" >> Release
          done

      # ==========================================================
      # IMPORT GPG PRIVATE KEY
      # ==========================================================

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" \
            | gpg --batch --import

      # ==========================================================
      # SIGN APT RELEASE
      # ==========================================================

      - name: Sign APT repository
        env:
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          cd repository/apt/dists/stable

          gpg \
            --batch \
            --yes \
            --local-user "$APT_GPG_KEY_ID" \
            --armor \
            --detach-sign \
            --output Release.gpg \
            Release

          gpg \
            --batch \
            --yes \
            --local-user "$APT_GPG_KEY_ID" \
            --clearsign \
            --output InRelease \
            Release

      # ==========================================================
      # COPY PUBLIC KEY
      # ==========================================================

      - name: Copy public APT key
        run: |
          cp apt/xnote-keyring.asc \
            repository/apt/xnote-keyring.asc

      # ==========================================================
      # COPY RPM PACKAGE
      # ==========================================================

      - name: Copy RPM package
        run: |
          cp packages/rpm/*.rpm \
            repository/rpm/x86_64/

      # ==========================================================
      # CREATE RPM REPOSITORY
      # ==========================================================

      - name: Create RPM repository metadata
        run: |
          createrepo_c \
            repository/rpm/x86_64

      # ==========================================================
      # COPY APPIMAGE
      # ==========================================================

      - name: Copy AppImage
        run: |
          cp packages/appimage/*.AppImage \
            repository/appimage/

      # ==========================================================
      # CREATE INSTALLATION INFORMATION
      # ==========================================================

      - name: Create repository website
        run: |
          cat > repository/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>Xnote Linux Packages</title>
          </head>

          <body>

              <h1>Xnote Linux Packages</h1>

              <p>Current version: ${VERSION}</p>

              <h2>Debian / Ubuntu / Linux Mint</h2>

              <p>Install the Xnote repository key:</p>

              <pre>
          curl -fsSL https://viragsimplecoder0008.github.io/Xnote/apt/xnote-keyring.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/xnote-archive-keyring.gpg
              </pre>

              <p>Add the repository:</p>

              <pre>
          echo "deb [signed-by=/usr/share/keyrings/xnote-archive-keyring.gpg] https://viragsimplecoder0008.github.io/Xnote/apt stable main" \
            | sudo tee /etc/apt/sources.list.d/xnote.list
              </pre>

              <p>Install Xnote:</p>

              <pre>
          sudo apt update
          sudo apt install xnote
              </pre>

              <h2>Fedora / Red Hat</h2>

              <p>Add the Xnote repository:</p>

              <pre>
          sudo dnf config-manager addrepo \
            --from-repofile=https://viragsimplecoder0008.github.io/Xnote/rpm/xnote.repo
              </pre>

              <p>Then install:</p>

              <pre>
          sudo dnf install xnote
              </pre>

              <h2>Arch Linux</h2>

              <pre>
          yay -S xnote
              </pre>

              <p>Or:</p>

              <pre>
          paru -S xnote
              </pre>

              <h2>AppImage</h2>

              <p>
                  Download the AppImage from
                  <a href="https://github.com/viragsimplecoder0008/Xnote/releases">
                      GitHub Releases
                  </a>.
              </p>

          </body>
          </html>
          EOF

      # ==========================================================
      # CREATE RPM REPOSITORY FILE
      # ==========================================================

      - name: Create RPM repository configuration
        run: |
          cat > repository/rpm/xnote.repo << 'EOF'
          [xnote]
          name=Xnote
          baseurl=https://viragsimplecoder0008.github.io/Xnote/rpm/x86_64/
          enabled=1
          gpgcheck=0
          EOF

      # ==========================================================
      # PUBLISH TO GH-PAGES
      # ==========================================================

      - name: Publish to gh-pages
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages

          git checkout gh-pages

          git rm -rf . \
            --exclude=.git \
            || true

          cp -r repository/. .

          git add .

          git commit \
            -m "Publish Xnote ${VERSION}" \
            || echo "Nothing to commit"

          git push origin gh-pages
